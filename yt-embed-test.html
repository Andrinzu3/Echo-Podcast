<!doctype html>
<meta charset="utf-8">
<title>YT Embed Test</title>
<style>
  html,body{height:100%;margin:0}
  .wrap{max-width:900px;margin:4rem auto;padding:0 16px}
  .player{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block}
  /* Fallback, falls aspect-ratio nicht greift */
  @supports not (aspect-ratio: 16 / 9) {
    .player { width:100%; height:0; padding-bottom:56.25%; position:relative; }
    .player{ position:absolute; inset:0; }
  }
</style>
<div class="wrap">
  <iframe class="player"
    src="https://www.youtube-nocookie.com/embed/videoseries?list=UUMvOsNaPaGkskrzEzlMc7bg&rel=0&modestbranding=1"
    title="Neueste Videos"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen></iframe>
</div>
